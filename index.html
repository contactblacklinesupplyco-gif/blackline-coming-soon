<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Blackline Supply Co. — Ouverture prochaine</title>
  <meta
    name="description"
    content="Blackline Supply Co. — Importateur français de boissons énergisantes américaines. Ouverture prochaine."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #1a1a1a 0%, #080808 45%, #000 100%);
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 760px;
      padding: 56px 32px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.035);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
    }

    .brand {
      margin-bottom: 18px;
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .slogan {
      margin-bottom: 34px;
      font-size: clamp(1rem, 2.5vw, 1.35rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #d7d7d7;
    }

    h1 {
      margin-bottom: 18px;
      font-size: clamp(1.7rem, 4vw, 3rem);
    }

    p {
      max-width: 590px;
      margin: 0 auto;
      font-size: 1.05rem;
      line-height: 1.7;
      color: #bdbdbd;
    }

    .status {
      display: inline-block;
      margin-top: 34px;
      padding: 12px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    footer {
      margin-top: 40px;
      font-size: 0.85rem;
      color: #737373;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">Blackline Supply Co.</div>
    <div class="slogan">Fuel Your Limits.</div>

    <h1>Ouverture prochaine</h1>

    <p>
      Une nouvelle sélection de boissons énergisantes américaines
      arrive bientôt en France.
    </p>

    <div class="status">Site en cours de création</div>

    <footer>
      © 2026 Blackline Supply Co.
    </footer>
  </main>
</body>
</html>
